name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stock-investment-app-hcodvj
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Obfuscated path — do not link from anywhere; share the URL only with intended users.
env:
  APP_SLUG: signal-4a7f2c8b3e9147d2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (obfuscated path, no root index)
        run: |
          mkdir -p "_site/$APP_SLUG"
          cp -r stock-app/* "_site/$APP_SLUG/"
          # Root gets an intentional 404 page (no discoverable links)
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>404</title>
          <style>body{font-family:sans-serif;background:#111;color:#666;text-align:center;padding:80px}</style>
          </head><body><h1>404</h1><p>Not found.</p></body></html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print obfuscated URL
        run: |
          echo "----------------------------------------"
          echo "App URL: ${{ steps.deployment.outputs.page_url }}${APP_SLUG}/"
          echo "----------------------------------------"
